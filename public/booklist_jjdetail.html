<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>书单详情 - 自留地</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/all.min.css" rel="stylesheet">
    <link href="/css/sweetalert2.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
    <script src="/js/token-manager.js"></script>
    <style>
        body { background: #f8fafc; color: #1e293b; padding-top: 60px; padding-bottom: 80px; }
        .jj-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            padding: 20px 16px;
            border-radius: 0 0 20px 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }
        .jj-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
        .jj-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .jj-user-info { display: flex; align-items: center; gap: 8px; }
        .jj-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); object-fit: cover; }
        .jj-user-name { font-weight: 600; font-size: .95rem; }
        .jj-stats { display: flex; gap: 16px; font-size: .85rem; opacity: .9; }
        .jj-stats-item { display: flex; align-items: center; gap: 4px; }
        .jj-description { background: rgba(255,255,255,.2); padding: 12px; border-radius: 10px; margin-top: 12px; font-size: .9rem; line-height: 1.5; backdrop-filter: blur(10px); }
        .jj-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .jj-tag { background: rgba(255,255,255,.3); padding: 4px 10px; border-radius: 15px; font-size: .75rem; backdrop-filter: blur(10px); }
        .section-block { background: #fff; margin: 1rem 0; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: 1rem; }
        .section-title { font-size: 1.25rem; font-weight: 600; margin: 0; display: flex; align-items: center; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .book-count { color: #64748b; font-weight: normal; font-size: .9em; margin-left: .5rem; }
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
        .book-card { background: #fff; border-radius: 8px; padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); transition: all .3s ease; border: 1px solid #e2e8f0; cursor: pointer; position: relative; overflow: hidden; }
        .book-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,.15); }
        .book-card-content { display: flex; gap: 1rem; align-items: flex-start; }
        .book-cover { position: relative; flex-shrink: 0; }
        .book-cover img { width: 90px; height: 120px; object-fit: cover; border-radius: 6px; display: block; background: linear-gradient(135deg,#f0f0f0,#e0e0e0); }
        .book-number { position: absolute; top: -8px; left: -8px; background: #6366f1; color: #fff; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 600; z-index: 2; }
        .book-score-tag { position: absolute; bottom: -6px; right: -6px; background: rgba(0,0,0,.7); color: #fff; padding: 3px 6px; border-radius: 4px; font-size: .65rem; font-weight: 600; min-width: 32px; text-align: center; backdrop-filter: blur(4px); z-index: 2; }
        .book-info { flex: 1; min-width: 0; }
        .book-title { font-size: .9rem; font-weight: 600; margin: 0 0 .5rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .book-meta { display: flex; align-items: center; gap: 1rem; margin-bottom: .5rem; flex-wrap: wrap; }
        .book-author, .book-size { font-size: .75rem; color: #64748b; display: flex; align-items: center; }
        .book-stats { display: flex; gap: .75rem; font-size: .7rem; color: #64748b; margin-bottom: .5rem; flex-wrap: wrap; }
        .book-rating-row { display: flex; align-items: center; gap: .75rem; margin-bottom: .5rem; flex-wrap: wrap; }
        .book-rating { display: flex; align-items: center; gap: .5rem; }
        .rating-stars { color: #fbbf24; font-size: .8rem; }
        .rating-score { font-size: .75rem; color: #64748b; }
        .status-tag { display: inline-flex; align-items: center; padding: .2rem .5rem; border-radius: .25rem; font-size: .65rem; font-weight: 500; white-space: nowrap; }
        .status-tag.completed { background: rgba(34,197,94,.1); color: #16a34a; border: 1px solid rgba(34,197,94,.2); }
        .status-tag.serializing { background: rgba(59,130,246,.1); color: #2563eb; border: 1px solid rgba(59,130,246,.2); }
        .status-tag.paused { background: rgba(245,158,11,.1); color: #d97706; border: 1px solid rgba(245,158,11,.2); }
        .book-recommendation { margin-top: .75rem; padding-top: .75rem; border-top: 1px dashed #e2e8f0; }
        .recommendation-text { font-size: .8rem; line-height: 1.5; margin: 0; background: #f8fafc; padding: .75rem; border-radius: 6px; white-space: pre-line; word-break: break-word; }
        .jj-emoji { width: 20px; height: 20px; vertical-align: middle; margin: 0 2px; }
        .loading { text-align: center; padding: 2rem; color: #64748b; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #f3f3f3; border-top: 2px solid #6366f1; border-radius: 50%; animation: spin 1s linear infinite; margin-right: .5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 3rem 1rem; color: #64748b; }
        .nav-center-title { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 16px; min-width: 0; }
        .nav-title-text { font-size: 1rem; font-weight: 600; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        @media (max-width: 768px) {
            .books-grid { grid-template-columns: 1fr; }
            .jj-title { font-size: 1.3rem; }
            .section-block { padding: 1rem; }
            .nav-title-text { font-size: .85rem; max-width: 150px; }
        }
    </style>
</head>
<body>
<!-- ===== 顶部导航 ===== -->
<nav class="top-navbar">
    <div class="nav-container">
        <div class="nav-left">
            <a href="user_login" class="nav-user nav-user-offline" title="点击登录">
                <div class="nav-user-avatar-wrap">
                    <img src="/uploads/avatars/default-avatar.png" class="nav-user-avatar" alt="默认头像"
                        onerror="this.src='/uploads/avatars/default-avatar.png'">
                    <span class="offline-dot"></span>
                </div>
            </a>
        </div>
        <div class="nav-center-title"><span class="nav-title-text" id="navTitleText">加载中...</span></div>
        <div class="nav-right"></div>
    </div>
</nav>

<div class="container-fluid" style="max-width:1200px;margin:0 auto;padding:20px;">
    <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        加载中...
    </div>

    <div id="content" style="display:none;">
        <div class="jj-header">
            <h1 class="jj-title" id="booklist-title"></h1>
            <div class="jj-meta">
                <div class="jj-user-info">
                    <img src="" class="jj-avatar" id="user-avatar" alt="用户头像"
                        onerror="this.src='/uploads/avatars/default-avatar.png'">
                    <span class="jj-user-name" id="user-name"></span>
                </div>
                <div class="jj-stats">
                    <div class="jj-stats-item"><i class="fas fa-book"></i> <span id="book-count">0</span> 本书</div>
                    <div class="jj-stats-item"><i class="fas fa-heart"></i> <span id="fav-count">0</span> 收藏</div>
                    <div class="jj-stats-item"><i class="far fa-clock"></i> <span id="publish-time"></span></div>
                </div>
            </div>
            <div class="jj-description" id="description-section" style="display:none;">
                <p id="booklist-description" style="margin:0"></p>
            </div>
            <div class="jj-tags" id="keywords-section" style="display:none;"></div>
        </div>

        <div class="section-block">
            <div class="section-header">
                <h2 class="section-title">
                    <i class="fas fa-book me-2"></i>书单内容
                    <span class="book-count" id="books-count">(0 本书)</span>
                </h2>
                <div class="sort-dropdown" style="min-width:120px;flex-shrink:0;">
                    <select class="form-select form-select-sm" id="book-sort">
                        <option value="">默认排序</option>
                        <option value="novelstar_desc">推荐星级</option>
                        <option value="novelname_asc">书名</option>
                    </select>
                </div>
            </div>
            <div id="books-section">
                <div class="books-grid" id="books-grid"></div>
            </div>
        </div>
    </div>
</div>

<!-- ===== 底部导航 ===== -->
<nav class="bottom-navbar">
    <div class="bottom-nav"></div>
</nav>

<script>
    window.currentPageName = 'booklist_jjdetail';
    window.__LIST__ = {{LIST_JSON}};
</script>
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/sweetalert2.all.min.js"></script>
<script src="/js/jjdetail.js"></script>
</body>
</html>
