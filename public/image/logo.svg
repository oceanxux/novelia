<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="novelia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="page-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- 背景圆角卡片 -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#novelia-grad)" filter="url(#glow)" />
  <!-- 书籍本体与书页翻动动感 -->
  <!-- 左书页 -->
  <path d="M12 16 C16 14.5, 21 15.5, 24 17.8 L24 34.5 C21 32.2, 16 31.2, 12 32.8 Z" fill="url(#page-grad)" opacity="0.95" />
  <!-- 右书页 -->
  <path d="M36 16 C32 14.5, 27 15.5, 24 17.8 L24 34.5 C27 32.2, 32 31.2, 36 32.8 Z" fill="url(#page-grad)" />
  <!-- 中间书脊与微光 -->
  <path d="M23.5 17.8 L24.5 17.8 L24.5 34.5 L23.5 34.5 Z" fill="#818cf8" opacity="0.4" />
  <!-- 灵动星芒 (Sparkle) 象征聚合与阅读智慧 -->
  <path d="M33 11 C33 13, 31.5 14, 30 14 C31.5 14, 33 15, 33 17 C33 15, 34.5 14, 36 14 C34.5 14, 33 13, 33 11 Z" fill="#fef08a" />
  <circle cx="15" cy="12" r="1.2" fill="#ffffff" opacity="0.8" />
</svg>
