<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/image/logo.svg">
<link rel="alternate icon" href="/favicon.ico">
<title>Novelia · 账户中心</title>
<link rel="stylesheet" href="/css/all.min.css">
<style>
:root {
  --primary: #0284c7;
  --primary-hover: #0369a1;
  --accent: #f59e0b;
  --bg-grid: #eef5fc;
  --card-bg: #ffffff;
  --text-main: #1e293b;
  --text-sub: #64748b;
  --border-card: #e2e8f0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-grid);
  color: var(--text-main);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow-x: hidden;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
  /* 手帐网格纹理底纹 */
  background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
  background-size: 18px 18px;
}

/* 趣味漂浮手帐贴纸与小标签 */
.sticker {
  position: fixed;
  pointer-events: none;
  z-index: 1;
  user-select: none;
  font-weight: 800;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  border-radius: 12px;
  padding: 6px 14px;
  font-size: 12px;
  animation: floatSlow 6s ease-in-out infinite alternate;
}
.sticker-1 {
  top: 8%;
  left: 6%;
  background: #fef08a;
  color: #854d0e;
  border: 1px solid #fde047;
  transform: rotate(-6deg);
}
.sticker-2 {
  bottom: 8%;
  right: 6%;
  background: #fbcfe8;
  color: #9d174d;
  border: 1px solid #f472b6;
  transform: rotate(5deg);
  animation-delay: -3s;
}
.sticker-3 {
  top: 14%;
  right: 8%;
  background: #bae6fd;
  color: #0369a1;
  border: 1px solid #7dd3fc;
  transform: rotate(4deg);
  animation-delay: -1.5s;
}
.sticker-4 {
  bottom: 12%;
  left: 7%;
  background: #bbf7d0;
  color: #166534;
  border: 1px solid #86efac;
  transform: rotate(-4deg);
  animation-delay: -4.5s;
}

@keyframes floatSlow {
  0% { transform: translateY(0px) rotate(var(--rot, 0deg)); }
  100% { transform: translateY(-10px) rotate(var(--rot, 0deg)); }
}

/* 核心容器 */
.auth-wrapper {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 410px;
  margin: 0 auto;
}

/* 顶部的和纸胶带装饰 */
.washi-tape {
  position: absolute;
  top: -13px;
  left: 50%;
  transform: translateX(-50%) rotate(-1.5deg);
  width: 140px;
  height: 26px;
  background: rgba(254, 240, 138, 0.95);
  border-left: 2px dashed rgba(234, 179, 8, 0.5);
  border-right: 2px dashed rgba(234, 179, 8, 0.5);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  z-index: 20;
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #854d0e;
  user-select: none;
}

/* 品牌头部 */
.brand-header {
  text-align: center;
  margin-bottom: 20px;
}
.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  background: #ffffff;
  border: 1.5px solid #e2e8f0;
  border-radius: 999px;
  font-size: 12.5px;
  color: #0284c7;
  font-weight: 700;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}
.brand-badge i {
  color: #0284c7;
}
.brand-title {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -0.4px;
  color: #0f172a;
  margin-bottom: 4px;
}
.brand-sub {
  font-size: 13px;
  color: var(--text-sub);
}

/* 手帐质感主卡片 */
.auth-card {
  position: relative;
  background: var(--card-bg);
  border: 1.5px solid #dbeafe;
  border-radius: 26px;
  padding: 32px 26px 24px;
  box-shadow: 0 16px 36px -6px rgba(14, 165, 233, 0.12), 0 4px 12px rgba(0,0,0,0.04);
  transition: transform 0.25s ease;
}

/* 选项卡 Tab 控制 */
.tab-pills {
  display: flex;
  background: #f1f5f9;
  padding: 4px;
  border-radius: 14px;
  margin-bottom: 22px;
  border: 1px solid #e2e8f0;
}
.tab-btn {
  flex: 1;
  padding: 9px 0;
  background: transparent;
  border: none;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text-sub);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.22s ease;
  font-family: inherit;
}
.tab-btn.active {
  background: #ffffff;
  color: #0284c7;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
}

/* 注册关闭时, 隐藏注册入口与无意义单行 Tab */
body.no-register #btn-tab-reg,
body.no-register .reg-entry { display: none !important; }
body.no-register .tab-pills { display: none !important; }

/* 表单与输入框设计 */
.form-group {
  margin-bottom: 16px;
}
.form-label {
  display: block;
  font-size: 12.5px;
  font-weight: 700;
  color: #334155;
  margin-bottom: 6px;
}
.input-control {
  position: relative;
  display: flex;
  align-items: center;
}
.input-control .field-icon {
  position: absolute;
  left: 14px;
  color: #94a3b8;
  font-size: 14px;
  pointer-events: none;
  transition: color 0.2s ease;
}
.input-control input {
  width: 100%;
  padding: 12px 40px 12px 40px;
  background: #f8fafc;
  border: 1.5px solid #cbd5e1;
  border-radius: 12px;
  font-size: 14px;
  color: #0f172a;
  font-family: inherit;
  outline: none;
  transition: all 0.2s ease;
}
.input-control input:focus {
  border-color: #0284c7;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.16);
}
.input-control input:focus ~ .field-icon {
  color: #0284c7;
}
.input-control input::placeholder {
  color: #94a3b8;
}
.input-control .eye-toggle {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  color: #94a3b8;
  font-size: 14px;
  padding: 6px;
  cursor: pointer;
  transition: color 0.2s ease;
}
.input-control .eye-toggle:hover {
  color: #0284c7;
}

.input-hint {
  font-size: 11.5px;
  color: #64748b;
  margin-top: 5px;
  padding-left: 2px;
}

/* 主提交按钮 (活泼手帐胶囊果冻感) */
.submit-btn {
  width: 100%;
  padding: 13px 18px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
  color: #fff;
  font-size: 14.5px;
  font-weight: 800;
  letter-spacing: 0.3px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 20px;
}
.submit-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(2, 132, 199, 0.45);
}
.submit-btn:active:not(:disabled) {
  transform: scale(0.98);
}
.submit-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
  transform: none;
}

/* 按钮加载旋转 */
.btn-spinner {
  width: 18px;
  height: 18px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* 辅助导航链接 */
.auth-links {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px dashed #e2e8f0;
  font-size: 13px;
}
.auth-links a, .auth-links button {
  color: #0284c7;
  font-weight: 700;
  text-decoration: none;
  background: none;
  border: none;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: color 0.2s ease;
}
.auth-links a:hover, .auth-links button:hover {
  text-decoration: underline;
  color: #0369a1;
}

/* 步骤切换容器 */
.step-pane {
  display: none;
}
.step-pane.active {
  display: block;
  animation: fadeIn 0.24s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 验证码与倒计时 */
.countdown-box {
  text-align: center;
  margin-top: 14px;
  font-size: 13px;
  color: var(--text-sub);
}
.countdown-box span {
  color: #0284c7;
  font-weight: 700;
}
.countdown-box a {
  color: #0284c7;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
}
.back-btn-row {
  margin-top: 14px;
  text-align: center;
}
.back-btn-row a {
  color: #64748b;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}
.back-btn-row a:hover {
  color: #0284c7;
}

/* 成功状态展示 */
.success-card {
  text-align: center;
  padding: 10px 0;
}
.success-icon-wrap {
  width: 60px;
  height: 60px;
  background: #dcfce7;
  border: 2px solid #86efac;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #16a34a;
  font-size: 26px;
  margin-bottom: 14px;
}
.success-title {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 6px;
  color: #0f172a;
}
.success-desc {
  font-size: 13px;
  color: #64748b;
  line-height: 1.6;
  margin-bottom: 18px;
}
.success-box {
  background: #f8fafc;
  border: 1px dashed #cbd5e1;
  border-radius: 12px;
  padding: 12px;
  text-align: left;
  font-size: 12px;
  color: #475569;
  line-height: 1.8;
  margin-bottom: 20px;
}

/* Toast 提示 */
.custom-toast {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  padding: 11px 22px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 700;
  color: #fff;
  z-index: 9999;
  box-shadow: 0 10px 25px rgba(0,0,0,0.18);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.custom-toast.show {
  transform: translateX(-50%) translateY(0);
}
.custom-toast.success {
  background: #10b981;
}
.custom-toast.error {
  background: #ef4444;
}
.custom-toast.info {
  background: #0284c7;
}

/* 底部提示 */
.auth-footer {
  text-align: center;
  margin-top: 20px;
  font-size: 12px;
  color: #94a3b8;
  font-weight: 500;
}
</style>
</head>
<body class="__NO_REGISTER_CLASS__">

<!-- 趣味手帐飘落小贴纸 -->
<div class="sticker sticker-1" style="--rot:-6deg;">🎐 读点好书</div>
<div class="sticker sticker-2" style="--rot:5deg;">☕ 墨香慢品</div>
<div class="sticker sticker-3" style="--rot:4deg;">📖 跨端同步</div>
<div class="sticker sticker-4" style="--rot:-4deg;">✨ 纯净无广</div>

<div id="toast" class="custom-toast"></div>

<div class="auth-wrapper">
  
  <!-- 品牌头部 -->
  <div class="brand-header">
    <div class="brand-badge">
      <i class="fas fa-book-open"></i>
      <span>Novelia · 享受纯粹阅读</span>
    </div>
    <h1 class="brand-title">欢迎回来 📖</h1>
  </div>

  <!-- 主卡片 (带和纸胶带装饰) -->
  <div class="auth-card">
    <div class="washi-tape">✨ NOVELIA NOTE</div>

    <div class="tab-pills">
      <button class="tab-btn active" data-tab="login" id="btn-tab-login">登录</button>
      <button class="tab-btn" data-tab="register" id="btn-tab-reg">注册</button>
    </div>

    <!-- ===== 登录表单 ===== -->
    <div class="step-pane active" id="pane-login">
      <form id="form-login" autocomplete="off">
        <div class="form-group">
          <label class="form-label">账号 (邮箱)</label>
          <div class="input-control">
            <i class="fas fa-envelope field-icon"></i>
            <input type="email" id="login-email" placeholder="输入您的邮箱账号" required autocomplete="off">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">密码</label>
          <div class="input-control">
            <i class="fas fa-lock field-icon"></i>
            <input type="password" id="login-password" placeholder="输入登录密码" required autocomplete="off">
            <button type="button" class="eye-toggle" data-target="login-password">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px;">
          <label style="display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;color:#475569;user-select:none;font-weight:600;">
            <input type="checkbox" id="login-remember" checked style="width:16px;height:16px;accent-color:#0284c7;cursor:pointer;border-radius:4px;">
            <span>记住我 30 天</span>
          </label>
          <a href="forgot_password" style="font-size:12.5px;color:#0284c7;text-decoration:none;font-weight:700;">忘记密码？</a>
        </div>

        <button type="submit" class="submit-btn" id="btn-login-submit">
          <span>立即登录</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-links">
        <button type="button" class="reg-entry" onclick="switchMode('register')">没有账号？点击注册</button>
      </div>
    </div>

    <!-- ===== 注册 Step 1: 填写邮箱与密码 ===== -->
    <div class="step-pane" id="pane-reg1">
      <form id="form-reg1" autocomplete="off">
        <div class="form-group">
          <label class="form-label">账号 (邮箱)</label>
          <div class="input-control">
            <i class="fas fa-envelope field-icon"></i>
            <input type="email" id="reg-email" placeholder="用于接收密钥与验证码" required autocomplete="off">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">设置密码</label>
          <div class="input-control">
            <i class="fas fa-lock field-icon"></i>
            <input type="password" id="reg-password" placeholder="6-12位字符" minlength="6" maxlength="12" required autocomplete="off">
            <button type="button" class="eye-toggle" data-target="reg-password">
              <i class="far fa-eye"></i>
            </button>
          </div>
          <div class="input-hint">6-12位，建议组合字母与数字</div>
        </div>

        <div class="form-group">
          <label class="form-label">确认密码</label>
          <div class="input-control">
            <i class="fas fa-check-double field-icon"></i>
            <input type="password" id="reg-password2" placeholder="再次输入密码" minlength="6" maxlength="12" required autocomplete="off">
            <button type="button" class="eye-toggle" data-target="reg-password2">
              <i class="far fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="btn-reg1-submit">
          <span>发送验证码</span>
          <i class="fas fa-paper-plane"></i>
        </button>
      </form>

      <div class="auth-links">
        <button type="button" class="reg-entry" onclick="switchMode('login')">已有账号？返回登录</button>
      </div>
    </div>

    <!-- ===== 注册 Step 2: 验证码确认 ===== -->
    <div class="step-pane" id="pane-reg2">
      <form id="form-reg2" autocomplete="off">
        <div class="form-group">
          <label class="form-label">邮箱验证码</label>
          <div class="input-control">
            <i class="fas fa-shield-alt field-icon"></i>
            <input type="text" id="reg-vcode" placeholder="输入 6 位数字验证码" inputmode="numeric" maxlength="6" autocomplete="off" required>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="btn-reg2-submit">
          <span>完成注册</span>
          <i class="fas fa-check"></i>
        </button>
      </form>

      <div class="countdown-box" id="reg-countdown" style="display:none;"></div>
      <div class="back-btn-row">
        <a href="#" id="btn-reg-back"><i class="fas fa-chevron-left me-1"></i> 返回修改注册信息</a>
      </div>
    </div>

    <!-- ===== 注册成功展示 ===== -->
    <div class="step-pane" id="pane-reg-success">
      <div class="success-card">
        <div class="success-icon-wrap">
          <i class="fas fa-check"></i>
        </div>
        <h3 class="success-title">账号注册成功</h3>
        <p class="success-desc">您的专用 API 密钥已生成并绑定至账号：<br><strong style="color:#0284c7;" id="success-email"></strong></p>

        <div class="success-box">
          • 请妥善保管好您的登录密码与 API 密钥<br>
          • 登录后可在用户中心随时更新书源与查看设备
        </div>

        <button class="submit-btn" id="btn-go-login">
          <span>前往登录账号</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>

  </div>

  <div class="auth-footer">
    2026 &copy; Novelia. All rights reserved.
  </div>
</div>

<script>
let currentMode = 'login';
let cachedEmail = '';
let cachedPassword = '';
let countdownTimer = null;

// 自动检测已登录状态跳转 (若带有 error 参数说明服务端鉴权失败，须先清理本地失效凭据避免死循环)
(function checkAuth() {
  const params = new URLSearchParams(window.location.search);
  const errorMsg = params.get('error');
  if (errorMsg) {
    localStorage.removeItem('user_token');
    localStorage.removeItem('user_info');
    document.cookie = 'user_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    document.cookie = 'X-Novel-Token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    return;
  }

  const token = localStorage.getItem('user_token');
  const hasTokenCookie = document.cookie.split(';').some(c => c.trim().startsWith('X-Novel-Token=') || c.trim().startsWith('user_token='));
  if (token || hasTokenCookie) {
    const returnUrl = params.get('return_url') || 'user_center';
    window.location.href = returnUrl;
  }
})();

// URL 参数与 Mode 初始化
(function initMode() {
  const params = new URLSearchParams(window.location.search);
  const m = params.get('mode');
  const success = params.get('success');
  const errorMsg = params.get('error');
  const email = params.get('email');

  if (email) {
    const el = document.getElementById('login-email');
    if (el) el.value = email;
  }
  if (errorMsg) {
    showToast(errorMsg, 'error');
  } else if (success === 'logged_out') {
    showToast('已安全退出登录', 'info');
  } else if (success === 'registered') {
    showToast('注册成功，请使用新密码登录', 'success');
  }

  if (m === 'register') {
    switchMode('register');
  } else {
    switchMode('login');
  }
})();

// 检查系统注册开关配置
let allowRegister = true;
async function checkRegConfig() {
  try {
    const res = await fetch('/api/public_config').then(r => r.json());
    if (res && res.success) {
      allowRegister = res.allow_register;
      const regTab = document.getElementById('btn-tab-reg');
      const regLinks = document.querySelectorAll('button[onclick*="register"]');
      if (!allowRegister) {
        if (regTab) regTab.style.display = 'none';
        regLinks.forEach(b => {
          b.style.display = 'none';
        });
        if (currentMode === 'register') {
          switchMode('login');
          showToast('系统已暂停自主注册，请直接登录', 'info');
        }
      }
    }
  } catch(e) {}
}
checkRegConfig();

// 选项卡切换
function switchMode(mode) {
  if (mode === 'register' && !allowRegister) {
    showToast('系统当前已关闭自主注册功能，请联系管理员分配账户', 'error');
    return;
  }
  currentMode = mode;
  const tabLogin = document.getElementById('btn-tab-login');
  const tabReg = document.getElementById('btn-tab-reg');
  const paneLogin = document.getElementById('pane-login');
  const paneReg1 = document.getElementById('pane-reg1');
  const paneReg2 = document.getElementById('pane-reg2');
  const paneSuccess = document.getElementById('pane-reg-success');

  if (mode === 'login') {
    tabLogin.classList.add('active');
    tabReg.classList.remove('active');
    paneLogin.classList.add('active');
    paneReg1.classList.remove('active');
    paneReg2.classList.remove('active');
    paneSuccess.classList.remove('active');
  } else {
    tabLogin.classList.remove('active');
    tabReg.classList.add('active');
    paneLogin.classList.remove('active');
    paneReg1.classList.add('active');
    paneReg2.classList.remove('active');
    paneSuccess.classList.remove('active');
  }
}

document.getElementById('btn-tab-login').onclick = () => switchMode('login');
document.getElementById('btn-tab-reg').onclick = () => switchMode('register');

// 密码可见切换
document.querySelectorAll('.eye-toggle').forEach(btn => {
  btn.onclick = function(e) {
    e.preventDefault();
    const targetId = this.dataset.target;
    const input = document.getElementById(targetId);
    if (!input) return;
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    this.innerHTML = isPass ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
  };
});

// Toast 提示框
function showToast(msg, type = 'info') {
  const el = document.getElementById('toast');
  const icon = type === 'success' ? '<i class="fas fa-check-circle"></i>' : (type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : '<i class="fas fa-info-circle"></i>');
  el.innerHTML = `${icon} <span>${msg}</span>`;
  el.className = `custom-toast ${type} show`;
  setTimeout(() => el.classList.remove('show'), 2600);
}

// 按钮 Loading 状态
function setButtonLoading(btn, loading) {
  btn.disabled = loading;
  if (loading) {
    btn.dataset.origHtml = btn.innerHTML;
    btn.innerHTML = '<span class="btn-spinner"></span><span>处理中...</span>';
  } else if (btn.dataset.origHtml) {
    btn.innerHTML = btn.dataset.origHtml;
  }
}

// 倒计时工具
function startCountdown(seconds) {
  const box = document.getElementById('reg-countdown');
  box.style.display = 'block';
  let remaining = seconds;
  box.innerHTML = `未收到验证码？<span>${remaining}</span> 秒后可重新获取`;
  
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    remaining--;
    box.innerHTML = `未收到验证码？<span>${remaining}</span> 秒后可重新获取`;
    if (remaining <= 0) {
      clearInterval(countdownTimer);
      box.innerHTML = '<a href="#" id="btn-re-send"><i class="fas fa-redo me-1"></i> 重新发送验证码</a>';
      document.getElementById('btn-re-send').onclick = (e) => {
        e.preventDefault();
        sendRegisterCode();
      };
    }
  }, 1000);
}

// 重新发送验证码
function sendRegisterCode() {
  const fd = new FormData();
  fd.append('action', 'send_code');
  fd.append('email', cachedEmail);
  fd.append('password', cachedPassword);

  fetch('register_api', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        showToast('验证码已重新发送', 'success');
        startCountdown(res.data?.cooldown || 60);
      } else {
        showToast(res.message || '发送失败', 'error');
      }
    })
    .catch(() => showToast('网络连接失败，请稍后重试', 'error'));
}

// ===== 登录事件绑定 =====
document.getElementById('form-login').onsubmit = function(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('btn-login-submit');

  if (!email || !password) {
    showToast('请完整输入邮箱和密码', 'error');
    return;
  }

  const remember = document.getElementById('login-remember') ? document.getElementById('login-remember').checked : true;
  setButtonLoading(btn, true);
  const returnUrl = new URLSearchParams(window.location.search).get('return_url') || 'user_center';

  fetch('user_login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'login', email, password, return_url: returnUrl, remember })
  })
  .then(r => r.json())
  .then(res => {
    if (res.success) {
      localStorage.setItem('user_token', res.token);
      localStorage.setItem('user_info', JSON.stringify(res.user));
      let cookieExpires = '';
      if (remember) {
        const exp = new Date();
        exp.setTime(exp.getTime() + (30 * 24 * 60 * 60 * 1000));
        cookieExpires = `; expires=${exp.toUTCString()}`;
      }
      document.cookie = `user_token=${res.token}${cookieExpires}; path=/; SameSite=Lax`;
      document.cookie = `X-Novel-Token=${res.token}${cookieExpires}; path=/; SameSite=Lax`;
      showToast('登录成功，正在进入...', 'success');
      setTimeout(() => {
        window.location.href = res.redirect || 'user_center';
      }, 700);
    } else {
      showToast(res.message || '登录失败，请检查账号密码', 'error');
    }
  })
  .catch(() => showToast('网络故障，请稍后重试', 'error'))
  .finally(() => setButtonLoading(btn, false));
};

// ===== 注册 Step 1 事件 =====
document.getElementById('form-reg1').onsubmit = function(e) {
  e.preventDefault();
  const email = document.getElementById('reg-email').value.trim();
  const p1 = document.getElementById('reg-password').value;
  const p2 = document.getElementById('reg-password2').value;
  const btn = document.getElementById('btn-reg1-submit');

  if (!email) {
    showToast('请输入有效的邮箱地址', 'error');
    return;
  }
  if (p1.length < 6 || p1.length > 12) {
    showToast('密码长度须在 6-12 位之间', 'error');
    return;
  }
  if (p1 !== p2) {
    showToast('两次输入的密码不一致', 'error');
    return;
  }

  cachedEmail = email;
  cachedPassword = p1;
  setButtonLoading(btn, true);

  const fd = new FormData();
  fd.append('action', 'send_code');
  fd.append('email', email);
  fd.append('password', p1);

  fetch('register_api', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        if (res.data && res.data.auto_approved) {
          showRegisterSuccess();
        } else {
          showToast('验证码已发送至邮箱', 'success');
          document.getElementById('pane-reg1').classList.remove('active');
          document.getElementById('pane-reg2').classList.add('active');
          startCountdown(res.data?.cooldown || 60);
        }
      } else {
        showToast(res.message || '发送失败', 'error');
      }
    })
    .catch(() => showToast('网络通信失败，请稍后重试', 'error'))
    .finally(() => setButtonLoading(btn, false));
};

// ===== 注册 Step 2 校验验证码 =====
document.getElementById('form-reg2').onsubmit = function(e) {
  e.preventDefault();
  const code = document.getElementById('reg-vcode').value.trim();
  const btn = document.getElementById('btn-reg2-submit');

  if (code.length !== 6) {
    showToast('请输入 6 位数字验证码', 'error');
    return;
  }

  setButtonLoading(btn, true);
  const fd = new FormData();
  fd.append('action', 'verify_code');
  fd.append('email', cachedEmail);
  fd.append('password', cachedPassword);
  fd.append('code', code);

  fetch('register_api', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(res => {
      if (res.success) {
        showRegisterSuccess();
      } else {
        showToast(res.message || '验证码错误', 'error');
        document.getElementById('reg-vcode').value = '';
      }
    })
    .catch(() => showToast('网络故障，请稍后重试', 'error'))
    .finally(() => setButtonLoading(btn, false));
};

// 返回修改注册信息
document.getElementById('btn-reg-back').onclick = function(e) {
  e.preventDefault();
  if (countdownTimer) clearInterval(countdownTimer);
  document.getElementById('reg-countdown').style.display = 'none';
  document.getElementById('pane-reg2').classList.remove('active');
  document.getElementById('pane-reg1').classList.add('active');
};

// 限制验证码仅数字
document.getElementById('reg-vcode').oninput = function() {
  this.value = this.value.replace(/\D/g, '');
};

// 显示注册成功卡片
function showRegisterSuccess() {
  document.getElementById('success-email').textContent = cachedEmail;
  document.getElementById('pane-reg1').classList.remove('active');
  document.getElementById('pane-reg2').classList.remove('active');
  document.getElementById('pane-reg-success').classList.add('active');
  showToast('账号创建成功', 'success');

  document.getElementById('btn-go-login').onclick = function() {
    switchMode('login');
    document.getElementById('login-email').value = cachedEmail;
    document.getElementById('login-password').focus();
  };
}
</script>
