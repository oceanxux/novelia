<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>重置密码 - Novelia</title>
<link rel="stylesheet" href="/css/all.min.css">
<style>
:root {
  --primary: #6366f1;
  --primary-glow: rgba(99, 102, 241, 0.35);
  --bg-dark: #070913;
  --card-bg: rgba(22, 27, 46, 0.75);
  --card-border: rgba(255, 255, 255, 0.08);
  --text-primary: #f8fafc;
  --text-muted: #94a3b8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-primary);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow-x: hidden;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}

canvas#bgCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.glow-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.45;
}
.glow-orb-1 {
  width: 380px; height: 380px;
  background: radial-gradient(circle, #6366f1 0%, transparent 70%);
  top: -10%; right: -5%;
}
.glow-orb-2 {
  width: 320px; height: 320px;
  background: radial-gradient(circle, #ec4899 0%, transparent 70%);
  bottom: -10%; left: -5%;
}

.auth-wrapper {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
}

.brand-header {
  text-align: center;
  margin-bottom: 24px;
}
.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  font-size: 13px;
  color: #c7d2fe;
  margin-bottom: 12px;
  backdrop-filter: blur(8px);
}
.brand-title {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.6px;
  background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}
.brand-sub {
  font-size: 14px;
  color: var(--text-muted);
}

.auth-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 24px;
  padding: 30px 28px 24px;
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
}

.form-group {
  margin-bottom: 18px;
}
.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #cbd5e1;
  margin-bottom: 7px;
}
.input-control {
  position: relative;
  display: flex;
  align-items: center;
}
.input-control .field-icon {
  position: absolute;
  left: 14px;
  color: #64748b;
  font-size: 14px;
  pointer-events: none;
}
.input-control input {
  width: 100%;
  padding: 13px 40px;
  background: rgba(15, 23, 42, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  font-size: 14.5px;
  color: #fff;
  font-family: inherit;
  outline: none;
  transition: all 0.22s ease;
}
.input-control input:focus {
  border-color: #818cf8;
  background: rgba(15, 23, 42, 0.85);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.22);
}
.input-control input::placeholder {
  color: rgba(148, 163, 184, 0.4);
}
.input-control .eye-toggle {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  color: #64748b;
  font-size: 14px;
  padding: 6px;
  cursor: pointer;
}
.input-control .eye-toggle:hover { color: #cbd5e1; }

.submit-btn {
  width: 100%;
  padding: 13px 18px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 20px var(--primary-glow);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 24px;
}
.submit-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(99, 102, 241, 0.5);
}
.submit-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.step { display: none; }
.step.active { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.cooldown-text {
  text-align: center;
  margin-top: 14px;
  font-size: 13px;
  color: var(--text-muted);
}
.back-link {
  text-align: center;
  margin-top: 16px;
  font-size: 13px;
}
.back-link a {
  color: #94a3b8;
  text-decoration: none;
  transition: color 0.2s;
}
.back-link a:hover { color: #fff; }

.password-strength {
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}
.password-strength-meter {
  height: 100%;
  width: 0%;
  transition: all 0.3s ease;
}
.password-strength-text {
  font-size: 11.5px;
  color: #94a3b8;
  margin-top: 4px;
}

.custom-toast {
  position: fixed;
  top: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  padding: 12px 24px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 500;
  color: #fff;
  z-index: 9999;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.custom-toast.show { transform: translateX(-50%) translateY(0); }
.custom-toast.success { background: rgba(16, 185, 129, 0.9); border: 1px solid rgba(52, 211, 153, 0.4); }
.custom-toast.error { background: rgba(239, 68, 68, 0.9); border: 1px solid rgba(248, 113, 113, 0.4); }

.loader {
  width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.success-content { text-align: center; padding: 12px 0; }
.success-icon { font-size: 54px; color: #4ade80; margin-bottom: 14px; }
.success-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #fff; }
.success-message { font-size: 13.5px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.6; }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="glow-orb glow-orb-1"></div>
<div class="glow-orb glow-orb-2"></div>
<div id="toast" class="custom-toast"></div>

<div class="auth-wrapper">
  <div class="brand-header">
    <div class="brand-badge">
      <i class="fas fa-key"></i>
      <span>安全中心</span>
    </div>
    <h1 class="brand-title">重置密码</h1>
    <p class="brand-sub">通过邮箱验证重设您的账户登录密码</p>
  </div>

  <div class="auth-card">
    <!-- Step 1: 邮箱 -->
    <div class="step active" id="step-email">
      <form id="email-form">
        <div class="form-group">
          <label class="form-label">注册邮箱</label>
          <div class="input-control">
            <i class="fas fa-envelope field-icon"></i>
            <input type="email" id="email" required placeholder="请输入您的注册邮箱地址">
          </div>
        </div>

        <button type="submit" class="submit-btn" id="send-code-btn">
          <i class="fas fa-paper-plane"></i>
          <span>发送验证码</span>
        </button>
      </form>

      <div class="cooldown-text" id="cooldown-text" style="display: none;"></div>
      <div class="back-link">
        <a href="user_login"><i class="fas fa-arrow-left me-1"></i> 返回登录</a>
      </div>
    </div>

    <!-- Step 2: 验证码 -->
    <div class="step" id="step-verification">
      <form id="verification-form">
        <div class="form-group">
          <label class="form-label">邮箱验证码</label>
          <div class="input-control">
            <i class="fas fa-shield-alt field-icon"></i>
            <input type="text" id="verify_code" required placeholder="请输入 6 位数字验证码" inputmode="numeric" maxlength="6">
          </div>
        </div>

        <button type="submit" class="submit-btn" id="verify-btn">
          <i class="fas fa-check-circle"></i>
          <span>验证并继续</span>
        </button>
      </form>

      <div class="back-link">
        <a href="#" id="back-to-email"><i class="fas fa-arrow-left me-1"></i> 返回修改邮箱</a>
      </div>
    </div>

    <!-- Step 3: 新密码 -->
    <div class="step" id="step-password">
      <form id="password-form">
        <div class="form-group">
          <label class="form-label">新密码</label>
          <div class="input-control">
            <i class="fas fa-lock field-icon"></i>
            <input type="password" id="new-password" required placeholder="请输入 6-12 位新密码" minlength="6" maxlength="12">
            <button type="button" class="eye-toggle" id="toggle-new-password"><i class="far fa-eye"></i></button>
          </div>
          <div class="password-strength">
            <div class="password-strength-meter" id="new-password-strength-meter"></div>
          </div>
          <div class="password-strength-text" id="new-password-strength-text">密码强度：弱</div>
        </div>

        <div class="form-group">
          <label class="form-label">确认新密码</label>
          <div class="input-control">
            <i class="fas fa-check-double field-icon"></i>
            <input type="password" id="confirm-password" required placeholder="请再次输入新密码" minlength="6" maxlength="12">
            <button type="button" class="eye-toggle" id="toggle-confirm-password"><i class="far fa-eye"></i></button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="reset-password-btn">
          <i class="fas fa-check"></i>
          <span>确认修改密码</span>
        </button>
      </form>

      <div class="back-link">
        <a href="#" id="back-to-verification"><i class="fas fa-arrow-left me-1"></i> 返回修改验证码</a>
      </div>
    </div>

    <!-- Step 4: 完成 -->
    <div class="step" id="step-success">
      <div class="success-content">
        <div class="success-icon"><i class="fas fa-check-circle"></i></div>
        <h3 class="success-title">密码修改成功！</h3>
        <p class="success-message">您的密码已成功更新，请使用新密码登录</p>
        <button class="submit-btn" onclick="window.location.href='user_login'">
          <span>立即前往登录</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
class ForgotPasswordApp {
  constructor() {
    this.currentStep = 1;
    this.cooldownInterval = null;
    this.currentEmail = '';
    this.verificationCode = '';
    this.init();
  }

  init() {
    this.bindEvents();
    this.initPasswordStrength();
    this.initPasswordToggle();
    this.initBackground();
  }

  initBackground() {
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    const particles = [];
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.5 + 0.5,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3
      });
    }
    function draw() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = width; if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height; if (p.y > height) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(165, 180, 252, 0.4)';
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();
  }

  initPasswordStrength() {
    const passwordInput = document.getElementById('new-password');
    const strengthMeter = document.getElementById('new-password-strength-meter');
    const strengthText = document.getElementById('new-password-strength-text');
    if (!passwordInput) return;
    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;
      let strength = 0;
      if (password.length >= 6) strength += 30;
      if (password.length >= 9) strength += 20;
      if (/[A-Z]/.test(password)) strength += 25;
      if (/[0-9]/.test(password)) strength += 25;
      strength = Math.min(100, strength);

      let color = '#ef4444', text = '密码强度：弱';
      if (strength >= 75) { color = '#10b981'; text = '密码强度：强'; }
      else if (strength >= 50) { color = '#f59e0b'; text = '密码强度：中'; }
      strengthMeter.style.width = strength + '%';
      strengthMeter.style.backgroundColor = color;
      strengthText.textContent = text;
    });
  }

  initPasswordToggle() {
    const setup = (btnId, inputId) => {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      if (btn && input) {
        btn.onclick = () => {
          const isText = input.type === 'text';
          input.type = isText ? 'password' : 'text';
          btn.innerHTML = isText ? '<i class="far fa-eye"></i>' : '<i class="far fa-eye-slash"></i>';
        };
      }
    };
    setup('toggle-new-password', 'new-password');
    setup('toggle-confirm-password', 'confirm-password');
  }

  bindEvents() {
    document.getElementById('email-form').addEventListener('submit', (e) => {
      e.preventDefault();
      this.handleEmailSubmit();
    });
    document.getElementById('verification-form').addEventListener('submit', (e) => {
      e.preventDefault();
      this.handleVerificationSubmit();
    });
    document.getElementById('password-form').addEventListener('submit', (e) => {
      e.preventDefault();
      this.handlePasswordSubmit();
    });
    document.getElementById('verify_code').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '');
    });
    document.getElementById('back-to-email').addEventListener('click', (e) => {
      e.preventDefault();
      this.previousStep('email');
    });
    document.getElementById('back-to-verification').addEventListener('click', (e) => {
      e.preventDefault();
      this.previousStep('verification');
    });
  }

  async handleEmailSubmit() {
    const email = document.getElementById('email').value.trim();
    const button = document.getElementById('send-code-btn');
    if (!email || !email.includes('@')) {
      this.showToast('请输入有效的邮箱地址', 'error');
      return;
    }
    this.currentEmail = email;
    this.setButtonLoading(button, true);

    try {
      const response = await this.apiCall('send_reset_code', { email });
      if (response.success) {
        this.showToast('验证码已发送至邮箱', 'success');
        this.nextStep('verification');
        this.startCooldown(response.data?.cooldown || 60);
      } else {
        this.showToast(response.message || '发送失败', 'error');
      }
    } catch (e) {
      this.showToast('网络通信异常，请重试', 'error');
    } finally {
      this.setButtonLoading(button, false);
    }
  }

  async handleVerificationSubmit() {
    const code = document.getElementById('verify_code').value.trim();
    if (code.length !== 6) {
      this.showToast('请输入 6 位验证码', 'error');
      return;
    }
    this.verificationCode = code;
    this.nextStep('password');
  }

  async handlePasswordSubmit() {
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const button = document.getElementById('reset-password-btn');

    if (newPassword.length < 6 || newPassword.length > 12) {
      this.showToast('密码长度须在 6-12 位之间', 'error');
      return;
    }
    if (newPassword !== confirmPassword) {
      this.showToast('两次输入的密码不一致', 'error');
      return;
    }

    this.setButtonLoading(button, true);
    try {
      const response = await this.apiCall('reset_password', {
        email: this.currentEmail,
        code: this.verificationCode,
        password: newPassword
      });
      if (response.success) {
        this.showToast('密码修改成功！', 'success');
        this.nextStep('success');
      } else {
        this.showToast(response.message || '重置失败', 'error');
      }
    } catch (e) {
      this.showToast('网络错误，请稍后重试', 'error');
    } finally {
      this.setButtonLoading(button, false);
    }
  }

  nextStep(target) {
    const steps = ['email', 'verification', 'password', 'success'];
    const currentStep = this.currentStep;
    const targetIndex = steps.indexOf(target);
    if (targetIndex === -1) return;
    document.getElementById(`step-${steps[currentStep - 1]}`).classList.remove('active');
    document.getElementById(`step-${target}`).classList.add('active');
    this.currentStep = targetIndex + 1;
  }

  previousStep(target) {
    const steps = ['email', 'verification', 'password', 'success'];
    const currentStep = this.currentStep;
    const targetIndex = steps.indexOf(target);
    if (targetIndex === -1) return;
    document.getElementById(`step-${steps[currentStep - 1]}`).classList.remove('active');
    document.getElementById(`step-${target}`).classList.add('active');
    this.currentStep = targetIndex + 1;
  }

  startCooldown(seconds) {
    const box = document.getElementById('cooldown-text');
    box.style.display = 'block';
    let rem = seconds;
    box.innerHTML = `未收到验证码？<span>${rem}</span> 秒后可重新获取`;
    if (this.cooldownInterval) clearInterval(this.cooldownInterval);
    this.cooldownInterval = setInterval(() => {
      rem--;
      box.innerHTML = `未收到验证码？<span>${rem}</span> 秒后可重新获取`;
      if (rem <= 0) {
        clearInterval(this.cooldownInterval);
        box.innerHTML = '<a href="#" id="resend-link" style="color:#818cf8;text-decoration:none;"><i class="fas fa-redo me-1"></i> 重新发送验证码</a>';
        document.getElementById('resend-link').onclick = (e) => {
          e.preventDefault();
          this.handleEmailSubmit();
        };
      }
    }, 1000);
  }

  async apiCall(action, data = {}) {
    const res = await fetch('forgot_password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, ...data })
    });
    return await res.json();
  }

  setButtonLoading(button, loading) {
    button.disabled = loading;
    if (loading) {
      button.dataset.original = button.innerHTML;
      button.innerHTML = '<div class="loader"></div>';
    } else {
      button.innerHTML = button.dataset.original || '提交';
    }
  }

  showToast(message, type = 'error') {
    const toast = document.getElementById('toast');
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> <span>${message}</span>`;
    toast.className = `custom-toast ${type} show`;
    setTimeout(() => toast.classList.remove('show'), 3000);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  new ForgotPasswordApp();
});
</script>
</body>
</html>
