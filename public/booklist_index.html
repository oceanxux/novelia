<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Novelia · 探索全网好书</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/all.min.css" rel="stylesheet">
    <link href="/css/sweetalert2.min.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
    <script src="/js/token-manager.js"></script>
    <style>
        :root {
            --nav-glass: rgba(255, 255, 255, 0.88);
            --card-radius: 12px;
            --accent-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
        }
        body {
            background: #f8fafc;
            color: #1e293b;
            padding-bottom: 70px;
        }
        .top-navbar {
            background: var(--nav-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            height: 64px;
        }
        .nav-container {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 100%;
        }
        .brand-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #0f172a;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.4px;
        }
        .brand-logo-icon {
            width: 34px;
            height: 34px;
            background: var(--accent-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }
        .nav-search-box {
            position: relative;
            width: 320px;
        }
        .nav-search-box input {
            width: 100%;
            height: 40px;
            border-radius: 999px;
            border: 1px solid #e2e8f0;
            background: #f1f5f9;
            padding: 0 42px 0 16px;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }
        .nav-search-box input:focus {
            background: #fff;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .nav-search-box button {
            position: absolute;
            right: 4px;
            top: 4px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
        }

        /* 书籍展示模块 */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            margin-top: 10px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.2px;
        }
        .section-subtitle {
            font-size: 12px;
            color: #64748b;
            margin-left: 2px;
        }
        .refresh-btn {
            border-radius: 999px;
            font-size: 12.5px;
            padding: 5px 14px;
            border: 1px solid #e2e8f0;
            background: #fff;
            color: #475569;
            transition: all 0.2s;
            cursor: pointer;
        }
        .refresh-btn:hover {
            background: #f1f5f9;
            color: #0f172a;
            border-color: #cbd5e1;
        }

        /* 横向滚动流与网格 */
        .book-scroll {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 4px 2px 16px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .book-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .book-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .book-scroll .book-card {
            flex: 0 0 136px;
            width: 136px;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
            gap: 18px 14px;
            padding-bottom: 12px;
        }

        /* 现代质感书籍卡片 */
        .book-card {
            display: block;
            text-decoration: none;
            color: inherit;
            position: relative;
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .book-card:hover {
            transform: translateY(-4px);
        }
        .book-card .cover-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 12px;
            overflow: hidden;
            background: #e2e8f0;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
            transition: box-shadow 0.22s ease;
        }
        .book-card:hover .cover-wrap {
            box-shadow: 0 10px 22px rgba(99, 102, 241, 0.22);
        }
        .book-card .cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }
        .book-card:hover .cover-wrap img {
            transform: scale(1.04);
        }
        .book-card .src-badge {
            position: absolute;
            left: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 10.5px;
            font-weight: 600;
            padding: 3px 8px;
            border-top-right-radius: 8px;
            letter-spacing: 0.2px;
        }
        .book-card .b-title {
            font-size: 13.5px;
            font-weight: 700;
            margin: 8px 0 3px;
            line-height: 1.35;
            color: #0f172a;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .book-card .b-author {
            font-size: 12px;
            color: #64748b;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .book-empty {
            color: #94a3b8;
            text-align: center;
            padding: 36px 0;
            grid-column: 1 / -1;
            width: 100%;
        }
        .loading-dot {
            text-align: center;
            color: #94a3b8;
            padding: 32px 0;
            grid-column: 1 / -1;
            font-size: 13.5px;
            width: 100%;
        }

        /* 移动端与底部导航适配 */
        .bottom-navbar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid #e2e8f0;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            z-index: 1000;
        }
        .bottom-nav {
            display: flex;
            height: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .bottom-nav .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #64748b;
            font-size: 11px;
            font-weight: 500;
            gap: 3px;
            transition: color 0.2s;
        }
        .bottom-nav .nav-item.active, .bottom-nav .nav-item:hover {
            color: #6366f1;
        }
        .bottom-nav .nav-icon {
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .nav-search-box {
                display: none;
            }
            .hero-banner {
                padding: 20px 18px;
                border-radius: 16px;
                margin: 12px 0 18px;
            }
            .hero-title {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<nav class="top-navbar">
    <div class="nav-container">
        <!-- 品牌标识 -->
        <a href="/" class="brand-link">
            <div class="brand-logo-icon">
                <i class="fas fa-book-sparkles"></i>
            </div>
            <span>Novelia</span>
        </a>

        <!-- 居中即时搜索栏 -->
        <div class="nav-search-box">
            <form action="booklist_index" method="get">
                <input type="text" name="q" placeholder="全源极速搜书、搜作者..." value="{{SEARCH_Q}}">
                <button type="submit" title="搜索书籍">
                    <i class="fas fa-search"></i>
                </button>
            </form>
        </div>

        <!-- 右侧：个人中心入口 -->
        <div class="nav-right">
            <div class="dropdown">
                <a class="nav-user d-flex align-items-center gap-2" href="#" data-bs-toggle="dropdown" aria-expanded="false" style="text-decoration:none;">
                    <div class="nav-user-avatar-wrap">
                        <img src="{{AVATAR}}" class="nav-user-avatar" alt="用户头像" onerror="this.src='/uploads/avatars/default-avatar.png'">
                        <span class="online-dot"></span>
                    </div>
                    <span class="nav-user-nickname d-none d-sm-inline">{{NICKNAME}}</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" style="border-radius:12px; margin-top:10px;">
                    <li><a class="dropdown-item py-2" href="user_center"><i class="fas fa-user-circle me-2 text-primary"></i>个人中心</a></li>
                    <li><a class="dropdown-item py-2" href="/book_source.json"><i class="fas fa-cloud-arrow-down me-2 text-success"></i>导出 Legado 书源</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item py-2 text-danger logout-btn" href="#"><i class="fas fa-sign-out-alt me-2"></i>退出登录</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<!-- ===== 主内容区域 ===== -->
<div class="main-content" style="padding-top: 18px;">
    <div class="container" style="max-width: 1240px; padding: 0 16px;">

        <!-- 历史/最近阅读模块 (有历史时自动浮现) -->
        <div class="recent-read-section" id="recent-section" style="display:none; margin-bottom: 24px;">
            <div class="section-header">
                <div>
                    <h2 class="section-title">
                        <i class="fas fa-history text-primary"></i>最近阅读
                    </h2>
                    <span class="section-subtitle">随时回到上次阅读的章节</span>
                </div>
            </div>
            <div class="book-scroll" id="recent-books"></div>
        </div>

        <!-- 为你推荐 -->
        <div class="booklist-recommend-section mb-4">
            <div class="section-header">
                <div>
                    <h2 class="section-title">
                        <i class="fas fa-wand-magic-sparkles" style="color:#8b5cf6;"></i>为你推荐
                    </h2>
                    <span class="section-subtitle">来自全网书库的优质选品</span>
                </div>
                <button class="refresh-btn" onclick="loadBooks('recommend')">
                    <i class="fas fa-rotate me-1"></i>换一批
                </button>
            </div>
            <div class="book-scroll" id="recommend-books"></div>
        </div>

        <!-- 热门书籍 -->
        <div class="booklist-square-section mb-4">
            <div class="section-header">
                <div>
                    <h2 class="section-title">
                        <i class="fas fa-fire text-danger"></i>热门风云榜
                    </h2>
                    <span class="section-subtitle">读者最常查阅的高热作品</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <select class="form-select form-select-sm" id="hot-sort" onchange="loadBooks('hot')" style="border-radius:999px; font-size:12px; width:100px;">
                        <option value="hot" selected>热度优先</option>
                        <option value="new">最新入库</option>
                        <option value="random">随机排列</option>
                    </select>
                </div>
            </div>
            <div class="book-grid" id="hot-books"></div>
        </div>

        <!-- 发现好书 / 随机漫游 -->
        <div class="booklist-random-section mb-4">
            <div class="section-header">
                <div>
                    <h2 class="section-title">
                        <i class="fas fa-compass text-info"></i>好书漫游
                    </h2>
                    <span class="section-subtitle">邂逅意料之外的精彩故事</span>
                </div>
                <button class="refresh-btn" onclick="loadBooks('random')">
                    <i class="fas fa-shuffle me-1"></i>换一组
                </button>
            </div>
            <div class="book-grid" id="random-books"></div>
        </div>

    </div>
</div>

<!-- ===== 底部导航 ===== -->
<nav class="bottom-navbar">
    <div class="bottom-nav">
        <a class="nav-item active" href="booklist_index">
            <i class="fas fa-compass nav-icon"></i>
            <span>精选</span>
        </a>
        <a class="nav-item" href="/debug">
            <i class="fas fa-magnifying-glass nav-icon"></i>
            <span>发现</span>
        </a>
        <a class="nav-item" href="/book_source.json">
            <i class="fas fa-cloud-arrow-down nav-icon"></i>
            <span>书源</span>
        </a>
        <a class="nav-item" href="user_center">
            <i class="fas fa-user nav-icon"></i>
            <span>我的</span>
        </a>
    </div>
</nav>

<script>
    window.currentPageName = 'booklist_index';
    window.searchKeyword = '{{SEARCH_Q}}';
</script>
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/sweetalert2.all.min.js"></script>
<script src="/js/index.js"></script>
<script src="/js/books.js"></script>

</body>
</html>
